name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { php: '8.2', testbench: '^10.0' }
          - { php: '8.3', testbench: '^10.0' }
          - { php: '8.4', testbench: '^10.0' }
          - { php: '8.3', testbench: '^11.0' }
          - { php: '8.4', testbench: '^11.0' }
          - { php: '8.5', testbench: '^11.0' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '${{ matrix.php }}'
          extensions: intl, mbstring, dom, fileinfo, gd, sqlite3, pdo_sqlite
          tools: composer:v2
      - run: composer update --with "orchestra/testbench:${TESTBENCH_VERSION}" --prefer-dist --no-interaction
        env:
          TESTBENCH_VERSION: ${{ matrix.testbench }}
      - run: vendor/bin/phpunit
